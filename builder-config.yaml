# OpenTelemetry Collector Builder (ocb) manifest: an OTLP receiver and the
# OASA exporter. Build with `make otelcol`; the binary lands in _build/.
dist:
  name: otelcol-oasa
  description: OpenTelemetry Collector with the OASA exporter
  output_path: ./_build
  version: 0.1.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.162.0

exporters:
  - gomod: github.com/onaro-io/oasa-otel-exporter v0.1.0
    name: oasaexporter

replaces:
  - github.com/onaro-io/oasa-otel-exporter => ../
