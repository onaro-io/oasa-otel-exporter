oasa:

oasa/file:
  sink: file
  file:
    path: /var/log/oasa/usage.ndjson
  attribution:
    cost_center: resource.attributes["cost.center"]
    project_id: resource.attributes["project.id"]
    tags_from: ["team", "owner"]
  currency: USD

oasa/http:
  sink: http
  http:
    endpoint: https://api.example.com/v1/meridian/events
    token: secret-token
    max_batch_size: 500
    timeout: 5s
    headers:
      X-Producer: collector-1
  retry_on_failure:
    initial_interval: 1s
  sending_queue:
    enabled: false
