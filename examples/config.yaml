# Quick-start collector config: receive OTLP over HTTP on port 4318 and write
# OASA usage records to ./oasa-usage.ndjson. No account or network sink needed.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

exporters:
  oasa:
    sink: file
    file:
      path: ./oasa-usage.ndjson
    attribution:
      cost_center: resource.attributes["cost.center"]
      project_id: resource.attributes["project.id"]
      tags_from: ["team", "owner"]
    currency: USD

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [oasa]
